services:
  htapd:
    build: .
    image: ${HTAPD_IMAGE:-fluidb/htapd:local}
    ports:
      - "127.0.0.1:${HTAPD_PUBLISH_PORT:-3307}:3307"
    volumes:
      - htapd-data:/var/lib/htapd
    secrets:
      - htapd_root_password
    environment:
      HTAPD_PASSWORD_FILE: /run/secrets/htapd_root_password
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # htapd has no drain handler; this bounds crash-equivalent SIGTERM shutdown.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  htapd-data:

secrets:
  # Keep this host directory mode 0700 and the secret file mode 0444 so uid 10001 can read it.
  # The password only bootstraps root on the first start; rotate it with ALTER USER afterward.
  htapd_root_password:
    file: ${HTAPD_SECRETS_DIR:-./secrets}/htapd_root_password
